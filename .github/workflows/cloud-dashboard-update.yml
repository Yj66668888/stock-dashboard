name: Cloud Dashboard Update

on:
  schedule:
    # 数据刷新: 9:00-15:30 北京时间每30分钟 (UTC 1:00-7:30)
    #   - 13:00整点(UTC 5:00)除外——由 cloud-midday-scan 负责该时段推送，避免建仓预警重复
    #   - 整点仅 UTC 1,2,3,4,6,7 = 北京 9/10/11/12/14/15 点
    # 推送时间点(北京时间): 10:00 / 11:00 / 13:00(midday) / 14:00 / 14:40
    #   - 非推送时间点的运行由 wechat_notify.py 时间闸门拦截推送，数据照常刷新
    - cron: '0 1,2,3,4,6,7 * * 1-5'
    - cron: '30 1-7 * * 1-5'
    # 14:40 北京时间 建仓预警推送点
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-pipeline
  cancel-in-progress: false

jobs:
  dashboard-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update pipeline
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python cloud_pipeline.py update

      - name: Validate JS syntax (safety net)
        run: |
          python3 -c "
          import re, subprocess, sys
          for f in ['docs/index.html', 'index.html']:
              try:
                  html = open(f).read()
                  scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.DOTALL)
                  js = '\n'.join(scripts)
                  with open('/tmp/_check.js', 'w') as fh:
                      fh.write(js)
                  r = subprocess.run(['node', '--check', '/tmp/_check.js'], capture_output=True, text=True)
                  if r.returncode != 0:
                      print(f'JS ERROR in {f}:')
                      print(r.stderr[:500])
                      sys.exit(1)
                  print(f'JS OK: {f}')
              except FileNotFoundError:
                  print(f'SKIP: {f} not found')
          "

      - name: Commit and push
        run: |
          git config user.name 'Stock Bot'
          git config user.email 'bot@stock-dashboard.local'
          git add -A
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "Cloud update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            git push
            echo 'Pushed to GitHub - Pages will auto-rebuild'
          fi
