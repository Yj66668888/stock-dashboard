name: Cloud Dashboard Update

on:
  schedule:
    # 2026-10-14 定稿（凌晨两档 → 早间用户改回五档，每窗口跑一次）：
    #   每天5次运行，每次数据刷新+推送一起发，运行时刻落在对应推送窗内：
    #   - 10:00 档：北京 10:07（UTC 2:07），窗 9:57-10:45
    #   - 11:00 档：北京 11:07（UTC 3:07），窗 10:57-11:45
    #   - 13:00 档：北京 13:07（UTC 5:07），窗 12:57-13:45（midday-scan已取消，此档由update接管）
    #   - 14:00 档：北京 14:07（UTC 6:07），窗 13:57-14:42
    #   - 14:40 档：北京 14:43（UTC 6:43），窗 14:37-15:25（建仓预警点）
    # 推送窗口由 wechat_notify._PUSH_TIMES 定义（10:00/11:00/13:00/14:00/14:40 五档）
    # 大盘30分K回升监控在独立的 cloud-index-kdj-watch.yml（每30分钟）
    # 2026-08-27 错峰经验: 整点/半点是GitHub高峰易丢run，故用 :07/:43 起跑
    - cron: '7 2,3,5,6 * * 1-5'
    - cron: '43 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-update  # 2026-09-01拆组：update只跟update排队，不再挤掉full-scan/midday的pending
  cancel-in-progress: false

jobs:
  dashboard-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 2026-10-15 提到 20 分钟（precompute_daily_indicators 改 6 worker 并发后已很少触碰上限，留缓冲）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update pipeline
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python cloud_pipeline.py update

      - name: Validate JS syntax (safety net)
        run: |
          python3 -c "
          import re, subprocess, sys
          for f in ['docs/index.html', 'index.html']:
              try:
                  html = open(f).read()
                  scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.DOTALL)
                  js = '\n'.join(scripts)
                  with open('/tmp/_check.js', 'w') as fh:
                      fh.write(js)
                  r = subprocess.run(['node', '--check', '/tmp/_check.js'], capture_output=True, text=True)
                  if r.returncode != 0:
                      print(f'JS ERROR in {f}:')
                      print(r.stderr[:500])
                      sys.exit(1)
                  print(f'JS OK: {f}')
              except FileNotFoundError:
                  print(f'SKIP: {f} not found')
          "

      # 2026-09-18加: 数据新鲜度护栏 —— 作业用过期 checkout 跑完会覆盖远端新数据，
      # 实测 9-18 的 24 只新票被 9-17 的 34 只旧票覆盖(rebase -X theirs 反而保留了旧数据)。
      # 本次生成的数据比远端旧时直接拒绝推送，宁可少更一轮也不让线上回退。
      - name: Data freshness guard
        run: python3 ci_freshness_guard.py

      - name: Commit and push
        run: |
          git config user.name 'Stock Bot'
          git config user.email 'bot@stock-dashboard.local'
          git add -A
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "Cloud update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            # 2026-09-17修复: 原写法 git pull --rebase && git push 冲突时会静默失败(rebase中止但步骤仍报success),
            # 导致当日扫描数据丢失(9/17事故). 现改为: 冲突时 -X theirs 保留本次新数据, 任何失败都 exit 1 暴露出来.
            if ! git push; then
              echo 'Push rejected - syncing remote changes...'
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                echo 'FATAL: rebase conflict - could not keep fresh cloud data'
                git rebase --abort || true
                exit 1
              fi
              git push || { echo 'FATAL: push failed after rebase'; exit 1; }
            fi
            echo 'Pushed to GitHub - Pages will auto-rebuild'
          fi
