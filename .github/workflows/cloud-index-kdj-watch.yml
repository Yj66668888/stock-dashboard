name: Cloud Index KDJ Watch

# 2026-10-14 拆分自 cloud-dashboard-update.yml：
#   数据刷新降为每天两次(10:07/13:37)后，大盘30分K回升监控需要独立的盘中节奏，
#   否则 K 上穿20的时点若不在两个刷新点上，云端兜底就形同虚设。
# 每15分钟跑一次 index_kdj_watch.py（原 30 分钟，2026-10-28 加密，理由见 on.schedule 注释）。
# ⚠️ 注意登录"本地还在跑"的假设：实测本地 automation 自 10-27 起几乎不再触发，
#    本 workflow 已不是"兜底"而是**主通道**，故障排查请先看这里的 Runs。
# 脚本内置交易时段闸门(9:35-11:31/13:05-15:01)与非交易日过滤，窗外自动跳过。

on:
  schedule:
    # ★ 2026-10-28 由「每30分钟」加密到「每15分钟」，两个原因：
    #   ① 用户当天拍板：微信推送只保留大盘30分KDJ 与 大盘资金回流两条通道，
    #      本 workflow 是其中唯一健康的一条（资金回流的数据源东财当日全线 RemoteDisconnected），
    #      粒度必须收紧，否则错过 K∈[20,40) 的窗口就等于这条通道失效。
    #   ② 本地 automation 自 10-27 起整体停摆（实测 10-28 仅触发 1 次），云端已是唯一保障。
    # ⚠️ GitHub Actions schedule 有约 10 分钟排队延迟，实际起跑比 cron 晚一截，
    #    15 分钟粒度实测≈15 分钟间隔，加密到 10 分钟以下收益会被延迟吃掉且白烧配额。
    # UTC 1-7 = 北京 9-15；脚本自带交易时段闸门(9:35-11:31/13:05-15:01)，窗外自动跳过。
    - cron: '2,17,32,47 1-7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-kdj-watch
  cancel-in-progress: false

jobs:
  kdj-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run index KDJ rebound watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python index_kdj_watch.py --cloud
