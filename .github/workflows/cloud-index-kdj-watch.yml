name: Cloud Index KDJ Watch

# 2026-10-14 拆分自 cloud-dashboard-update.yml：
#   数据刷新降为每天两次(10:07/13:37)后，大盘30分K回升监控需要独立的盘中节奏，
#   否则 K 上穿20的时点若不在两个刷新点上，云端兜底就形同虚设。
# 每30分钟跑一次 index_kdj_watch.py（本地每5分钟跑同脚本，双端靠远端状态文件去重）。
# 脚本内置交易时段闸门(9:35-11:31/13:05-15:01)与非交易日过滤，窗外自动跳过。

on:
  schedule:
    # 北京 9:12-15:42 每30分钟（:12/:42，错开数据刷新的 :07/:37 防同时起跑）
    - cron: '12 1-7 * * 1-5'
    - cron: '42 1-7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-kdj-watch
  cancel-in-progress: false

jobs:
  kdj-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run index KDJ rebound watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python index_kdj_watch.py --cloud
