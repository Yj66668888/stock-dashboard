name: Cloud Midday Scan

on:
  schedule:
    # 1:00 PM Beijing = 5:00 UTC, Mon-Fri (午盘换票 + 低位启动扫描微信推送)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-pipeline
  cancel-in-progress: false

jobs:
  midday-scan:
    runs-on: ubuntu-latest
    # full_scan 实测需 27-30 分钟 + prelaunch 扫描，30 分钟必超时被杀(8/25-8/26连续两天)
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run midday pipeline (full + prelaunch scan)
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python cloud_pipeline.py midday

      - name: Validate JS syntax (safety net)
        run: |
          python3 -c "
          import re, subprocess, sys
          for f in ['docs/index.html', 'index.html']:
              try:
                  html = open(f).read()
                  scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.DOTALL)
                  js = '\n'.join(scripts)
                  with open('/tmp/_check.js', 'w') as fh:
                      fh.write(js)
                  r = subprocess.run(['node', '--check', '/tmp/_check.js'], capture_output=True, text=True)
                  if r.returncode != 0:
                      print(f'JS ERROR in {f}:')
                      print(r.stderr[:500])
                      sys.exit(1)
                  print(f'JS OK: {f}')
              except FileNotFoundError:
                  print(f'SKIP: {f} not found')
          "

      - name: Commit and push
        run: |
          git config user.name 'Stock Bot'
          git config user.email 'bot@stock-dashboard.local'
          git add -A
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "Cloud midday-scan $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            git push
            echo 'Pushed to GitHub - Pages will auto-rebuild'
          fi
