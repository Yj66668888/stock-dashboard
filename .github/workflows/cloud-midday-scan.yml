name: Cloud Midday Scan

# 2026-10-14 用户拍板取消午盘扫描（数据刷新降为每天10:00/13:30两次）。
# schedule 已移除，仅保留 workflow_dispatch 手动触发能力；
# 恢复方法：把下面的 schedule 块加回 on: 即可。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-midday  # 2026-09-01拆组：独立组防止被update挤掉pending槽
  cancel-in-progress: false

jobs:
  midday-scan:
    runs-on: ubuntu-latest
    # full_scan 实测需 27-30 分钟 + prelaunch 扫描，30 分钟必超时被杀(8/25-8/26连续两天)
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run midday pipeline (full + prelaunch scan)
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python cloud_pipeline.py midday

      - name: Validate JS syntax (safety net)
        run: |
          python3 -c "
          import re, subprocess, sys
          for f in ['docs/index.html', 'index.html']:
              try:
                  html = open(f).read()
                  scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.DOTALL)
                  js = '\n'.join(scripts)
                  with open('/tmp/_check.js', 'w') as fh:
                      fh.write(js)
                  r = subprocess.run(['node', '--check', '/tmp/_check.js'], capture_output=True, text=True)
                  if r.returncode != 0:
                      print(f'JS ERROR in {f}:')
                      print(r.stderr[:500])
                      sys.exit(1)
                  print(f'JS OK: {f}')
              except FileNotFoundError:
                  print(f'SKIP: {f} not found')
          "

      # 2026-09-18加: 数据新鲜度护栏 —— 作业用过期 checkout 跑完会覆盖远端新数据，
      # 实测 9-18 的 24 只新票被 9-17 的 34 只旧票覆盖(rebase -X theirs 反而保留了旧数据)。
      # 本次生成的数据比远端旧时直接拒绝推送，宁可少更一轮也不让线上回退。
      - name: Data freshness guard
        run: python3 ci_freshness_guard.py

      - name: Commit and push
        run: |
          git config user.name 'Stock Bot'
          git config user.email 'bot@stock-dashboard.local'
          git add -A
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "Cloud midday-scan $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            # 2026-09-17修复: 原写法 git pull --rebase && git push 冲突时会静默失败(rebase中止但步骤仍报success),
            # 导致当日扫描数据丢失(9/17事故). 现改为: 冲突时 -X theirs 保留本次新数据, 任何失败都 exit 1 暴露出来.
            if ! git push; then
              echo 'Push rejected - syncing remote changes...'
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                echo 'FATAL: rebase conflict - could not keep fresh cloud data'
                git rebase --abort || true
                exit 1
              fi
              git push || { echo 'FATAL: push failed after rebase'; exit 1; }
            fi
            echo 'Pushed to GitHub - Pages will auto-rebuild'
          fi
