name: Cloud Full Scan

on:
  schedule:
    # 8:33 AM Beijing = 0:33 UTC, Mon-Fri (2026-08-27错峰: 整半点高峰易丢run)
    - cron: '33 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-fullscan  # 2026-09-01拆组：独立组防止被30分钟一次的update挤掉pending槽
  cancel-in-progress: false

jobs:
  full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 2026-09-03: 30分钟连续3天强杀流水线([7c]全市场竞价扫描跑不完)，数据断更根因

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full pipeline
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python cloud_pipeline.py full

      - name: Validate JS syntax (safety net)
        run: |
          python3 -c "
          import re, subprocess, sys
          for f in ['docs/index.html', 'index.html']:
              try:
                  html = open(f).read()
                  scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.DOTALL)
                  js = '\n'.join(scripts)
                  with open('/tmp/_check.js', 'w') as fh:
                      fh.write(js)
                  r = subprocess.run(['node', '--check', '/tmp/_check.js'], capture_output=True, text=True)
                  if r.returncode != 0:
                      print(f'JS ERROR in {f}:')
                      print(r.stderr[:500])
                      sys.exit(1)
                  print(f'JS OK: {f}')
              except FileNotFoundError:
                  print(f'SKIP: {f} not found')
          "

      - name: Commit and push
        run: |
          git config user.name 'Stock Bot'
          git config user.email 'bot@stock-dashboard.local'
          git add -A
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "Cloud full-scan $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            # 2026-09-17修复: 原写法 git pull --rebase && git push 冲突时会静默失败(rebase中止但步骤仍报success),
            # 导致当日扫描数据丢失(9/17事故). 现改为: 冲突时 -X theirs 保留本次新数据, 任何失败都 exit 1 暴露出来.
            if ! git push; then
              echo 'Push rejected - syncing remote changes...'
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                echo 'FATAL: rebase conflict - could not keep fresh cloud data'
                git rebase --abort || true
                exit 1
              fi
              git push || { echo 'FATAL: push failed after rebase'; exit 1; }
            fi
            echo 'Pushed to GitHub - Pages will auto-rebuild'
          fi
