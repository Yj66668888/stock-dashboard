              stock.beta = betaData.beta;
              stock.betaCategory = betaData.category;
              stock.syncRate = betaData.syncRate;
              anyUpdate = true;
            }
          }
        }

        // 实时重算评分 + 方向 + 板块共振
        stock.healthScore = recalcScore(stock);
        stock.direction = regenDirection(stock);
        var _reson = calcSectorResonance(stock);
        if (_reson) {
          stock.sectorResonance = _reson.resonance;
          stock.sectorResonanceDetail = _reson.detail;
          anyUpdate = true;
        }

        // 强制使用fallback填充push2his API无法可靠提供的字段
        // (API对klt=30/60返回数据不完整，导致macd/MA/openRate30d为undefined)
        if (typeof KDJ_FALLBACK !== 'undefined') {
          var _fb = KDJ_FALLBACK[stock.code];
          if (_fb) {
            if (stock.kd30_k === undefined && _fb.kd30_k !== undefined) stock.kd30_k = _fb.kd30_k;
            if (stock.kd30_d === undefined && _fb.kd30_d !== undefined) stock.kd30_d = _fb.kd30_d;
            if (stock.kd30_cross === undefined && _fb.kd30_cross !== undefined) stock.kd30_cross = _fb.kd30_cross;
            if (stock.kd60_k === undefined && _fb.kd60_k !== undefined) stock.kd60_k = _fb.kd60_k;
            if (stock.kd60_d === undefined && _fb.kd60_d !== undefined) stock.kd60_d = _fb.kd60_d;
            if (stock.kd60_cross === undefined && _fb.kd60_cross !== undefined) stock.kd60_cross = _fb.kd60_cross;
            if (!stock.macd && _fb.macd) stock.macd = _fb.macd;
            if (!stock.ma && _fb.ma) stock.ma = _fb.ma;
            if (stock.ma20 === undefined && _fb.ma20 !== undefined) stock.ma20 = _fb.ma20;
            if (stock.openRate30d === undefined && _fb.openRate30d !== undefined) stock.openRate30d = _fb.openRate30d;
            if (stock.openRateTotal === undefined && _fb.openRateTotal !== undefined) stock.openRateTotal = _fb.openRateTotal;
            if (stock.openRateScore === undefined && _fb.openRateScore !== undefined) stock.openRateScore = _fb.openRateScore;
            if (stock.pe === undefined && _fb.pe !== undefined && _fb.pe > 0) stock.pe = _fb.pe;
            if (stock.pb === undefined && _fb.pb !== undefined && _fb.pb > 0) stock.pb = _fb.pb;
          }
        }

        if (anyUpdate) updated++;
      }).catch(function() {}).then(function() {
        done++;
        if (done % 10 === 0 || done === total) {
          if (updated > 0) {
            liveFlags.kdj = true;
            if (updated >= total * 0.5) {
              markSourceOk('kdj', _lastKlineHost);
            } else if (updated > 0) {
              sourceHealth.kdj.status = 'degraded';
              sourceHealth.kdj.host = _lastKlineHost;
            }
            updateHealthPanel();
          } else if (done === total && updated === 0) {
            markSourceFail('kdj', _lastKlineHost);
            updateHealthPanel();
          }
          renderStocks();
        }
      });
    }, i * 300);
  });
}

// ============================================
// 数据健康度面板 — 每个源单独显示状态/时间/host
// ============================================
function updateHealthPanel() {
  var el = document.getElementById('liveStatus');
  var dot = document.getElementById('liveDot');
  if (!el) return;

  var icon = { ok: '\u{1F7E2}', degraded: '\u{1F7E1}', down: '\u{1F534}', idle: '\u26AA' };
  var parts = [];
  var allOk = true;

  ['quotes', 'flow', 'kdj'].forEach(function(name) {
    var s = sourceHealth[name];
    if (!s) return;
    var label = s.label || name;
    var st = s.status || 'idle';
    if (st !== 'ok') allOk = false;
    var hostShort = s.host === '-' ? '' : s.host.replace(/\.eastmoney\.com/, '').replace(/\.gtimg\.cn/, '');
    var t = s.lastOk ? fmtTime(s.lastOk) : '';
    var tip = label + ': ' + st + (hostShort ? ' (' + hostShort + ')' : '') + (t ? ' ' + t : '') + (s.fails > 0 ? ' x' + s.fails : '');
    parts.push('<span class="src-chip src-' + st + '" title="' + tip + '">' + icon[st] + ' ' + label +
      (hostShort && st !== 'ok' ? '<span class="src-host">' + hostShort + '</span>' : '') +
      (t ? '<span class="src-time">' + t + '</span>' : '') +
      '</span>');
  });

  // 资金5d/10d 跟随flow状态
  if (sourceHealth.flow.status === 'ok') {
    liveFlags.flow5d = true;
  }

  el.innerHTML = parts.join(' ');
  if (dot) {
    if (allOk) { dot.classList.add('active'); dot.style.background = ''; }
    else { dot.classList.remove('active'); dot.style.background = '#f59e0b'; }
  }
}

// --- 1. 主线风口：实时板块行情（30秒刷新）---
async function fetchHotSectors() {
  try {
    // 行业板块 m:90+t:2，按主力资金净流入排序
    // 多域名轮转，fallback到预计算数据
    var domains = ['push2.eastmoney.com', '82.push2.eastmoney.com', '48.push2.eastmoney.com', '29.push2.eastmoney.com'];
    var data = null;
    for (var di = 0; di < domains.length; di++) {
      try {
        var url = 'https://' + domains[di] + '/api/qt/clist/get?fs=m:90+t:2&fields=f2,f3,f4,f12,f14,f62,f184,f66,f69,f72,f75,f78,f81,f84,f87,f104,f105&fid=f62&po=1&pz=30&pn=1&_=' + Date.now();
        data = await jsonpRequest(url, 5000);
        if (data && data.data && data.data.diff) break;
      } catch(e) { /* try next domain */ }
    }
    if (!data || !data.data || !data.data.diff) {
      console.warn('[fetchHotSectors] push2 clist API全部不可达，使用预计算板块数据');
      if (typeof SECTOR_FALLBACK !== 'undefined' && SECTOR_FALLBACK.length > 0) {
        liveHotSectors = SECTOR_FALLBACK.map(function(s) {
          var chg = s.changePct || 0;
          var status = chg > 5 ? '🔥主升浪' : (chg > 2 ? '🔥强势' : (chg > 0 ? '⬆走强' : '⬇走弱'));
          return {
            name: s.name, changePct: chg, mainFlow: s.mainFlow || 0,
            mainFlowPct: s.mainFlowPct || 0, superLargeFlow: s.superLargeFlow || 0,
            largeFlow: s.largeFlow || 0, upCount: s.upCount || 0, downCount: s.downCount || 0,
            code: s.code, status: status
          };
        });
        extraFlags.sectors = true;
        console.log('[fetchHotSectors] 使用预计算数据: ' + liveHotSectors.length + '个板块');
      }
      return;
    }
    var rows = data.data.diff;
    liveHotSectors = rows.map(function(s) {
      var chg = s.f3 || 0;
      var mainFlow = (s.f62 || 0) / 1e8;
      var superFlow = (s.f66 || 0) / 1e8;
      var status = chg > 5 ? '🔥主升浪' : (chg > 2 ? '🔥强势' : (chg > 0 ? '⬆走强' : '⬇走弱'));
      return {
        name: s.f14 || '--',
        changePct: chg,
        mainFlow: mainFlow,
        mainFlowPct: s.f184 || 0,
        superLargeFlow: superFlow,
        largeFlow: (s.f72 || 0) / 1e8,
        upCount: s.f104 || 0,
        downCount: s.f105 || 0,
        code: s.f12 || '',
        status: status
      };
    });
    // 按主力资金净流入排序
    liveHotSectors.sort(function(a, b) { return b.mainFlow - a.mainFlow; });
    liveHotSectors = liveHotSectors.slice(0, 15);
    extraFlags.sectors = true;
    console.log('[fetchHotSectors] 获取' + liveHotSectors.length + '个板块');
  } catch(e) {
    console.error('[fetchHotSectors]', e);
  }
}

// ============================================
// 初始化
// ============================================
var _fallbackApplied = false;  // 标记fallback是否已应用

// 立即应用KDJ_FALLBACK数据到所有股票（在首次渲染前调用）
function applyKDJFallbackEarly() {
  if (_fallbackApplied) return;
  if (typeof KDJ_FALLBACK === 'undefined') return;
  var keys = Object.keys(KDJ_FALLBACK);
  if (keys.length === 0) return;
  var allPool = [...STOCKS];
  var updated = 0;
  allPool.forEach(function(stock) {
    var fb = KDJ_FALLBACK[stock.code];
    if (fb) {
      try {
        if (fb.kd5_k !== undefined && stock.kd5_k === undefined) stock.kd5_k = fb.kd5_k;
        if (fb.kd5_d !== undefined && stock.kd5_d === undefined) stock.kd5_d = fb.kd5_d;
        if (fb.kd30_k !== undefined && stock.kd30_k === undefined) stock.kd30_k = fb.kd30_k;
        if (fb.kd30_d !== undefined && stock.kd30_d === undefined) stock.kd30_d = fb.kd30_d;
        if (fb.kd30_cross !== undefined && stock.kd30_cross === undefined) stock.kd30_cross = fb.kd30_cross;
        if (fb.kd60_k !== undefined && stock.kd60_k === undefined) stock.kd60_k = fb.kd60_k;
        if (fb.kd60_d !== undefined && stock.kd60_d === undefined) stock.kd60_d = fb.kd60_d;
        if (fb.kd60_cross !== undefined && stock.kd60_cross === undefined) stock.kd60_cross = fb.kd60_cross;
        if (fb.macd !== undefined && stock.macd === undefined) stock.macd = fb.macd;
        if (fb.ma !== undefined && stock.ma === undefined) stock.ma = fb.ma;
        if (fb.ma20 !== undefined && stock.ma20 === undefined) stock.ma20 = fb.ma20;
        if (fb.maAbove !== undefined && stock.maAbove === undefined) stock.maAbove = fb.maAbove;
        if (fb.rsi !== undefined && stock.rsi === undefined) stock.rsi = fb.rsi;
        if (fb.drop20d !== undefined && stock.drop20d === undefined) stock.drop20d = fb.drop20d;
        if (fb.volRatio !== undefined && stock.volRatio === undefined) stock.volRatio = fb.volRatio;
        if (fb.openRate30d !== undefined && stock.openRate30d === undefined) stock.openRate30d = fb.openRate30d;
        if (fb.openRateTotal !== undefined && stock.openRateTotal === undefined) stock.openRateTotal = fb.openRateTotal;
        if (fb.openRateScore !== undefined && stock.openRateScore === undefined) stock.openRateScore = fb.openRateScore;
        if (fb.pe !== undefined && fb.pe > 0 && stock.pe === undefined) stock.pe = fb.pe;
        if (fb.pb !== undefined && fb.pb > 0 && stock.pb === undefined) stock.pb = fb.pb;
        // 主力资金不由KDJ_FALLBACK覆盖，由fetchCapitalFlow()每30秒独立刷新
        // 重算评分和方向（基于fallback数据）
        try {
          stock.healthScore = recalcScore(stock);
          stock.direction = regenDirection(stock);
        } catch(e2) { /* 评分失败不影响数据显示 */ }
        updated++;
      } catch(e) {
        console.error('[applyKDJFallbackEarly] error for', stock.code, e.message);
      }
    }
  });
  _fallbackApplied = true;
  console.log('[applyKDJFallbackEarly] Applied fallback to ' + updated + ' stocks');
}

(function init() {
  try {
    // 立即更新badges，确保即使后面出错也能看到数据
    const _bs = document.getElementById('badgeStocks');
    if (_bs) _bs.textContent = STOCKS.length;
    console.log('[Init] STOCKS.length =', STOCKS.length);

    // 同步按钮高亮状态
    document.getElementById('btnStocks').classList.toggle('active', currentPool === 'stocks');

    // ★ 先从KDJ_PRECOMPUTED缓存填充5分钟/30分钟KDJ（最新数据）
    initPrecomputedKDJ();
    // ★ 从CAPITAL_FLOW_CACHE缓存填充主力资金（fetchCapitalFlow会覆盖为实时数据）
    initPrecomputedCapitalFlow();

    // ★ 再应用KDJ_FALLBACK数据（只填充缺失字段，不覆盖PRECOMPUTED已填的）
    applyKDJFallbackEarly();

    renderAll();
    // 更新日期标签
    var _dateTag = getDateStr() + ' ' + getWeekdayStr() + ' ' + getNowStr();
    // ★ 资金流独立请求，不依赖fetchQuotes（固定票的5日/10日资金完全靠API）
    fetchCapitalFlow().then(() => { renderStats(); renderStocks(); });
    fetchQuotes().then(() => {
      renderStats();
      renderStocks();
      setTimeout(() => fetchAllKDJ(), 2000);
    }).catch(e => console.error('[Init] fetchQuotes error:', e));
    startQuoteRefresh();
    // 板块风口数据（供股票表格板块共振使用）
    setTimeout(function() { fetchHotSectors(); }, 500);
    startExtraRefresh();
  } catch(e) {
    console.error('[Init] FATAL ERROR:', e);
    console.error('[Init] Stack:', e.stack);
    // 显示错误在页面上
    const body = document.getElementById('stockBody');
    if (body) {
      body.innerHTML = '<tr><td colspan="27" style="color:red;padding:20px;text-align:center;">⚠️ 初始化错误: ' + e.message + '<br><pre style="text-align:left;font-size:11px;">' + (e.stack||'').substring(0,500) + '</pre></td></tr>';
    }
  }
})();
</script>
